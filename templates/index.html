<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, Inter, Segoe UI, sans-serif; background: #f5f5f7; height: 100vh; display: flex; }
  .sidebar { width: 240px; background: #ffffff; display: flex; flex-direction: column; border-right: 1px solid #e5e5e7; }
  .sidebar-header { padding: 20px 18px; color: #1d1d1f; font-weight: 600; font-size: 14px; border-bottom: 1px solid #e5e5e7; }
  .sidebar-content { flex: 1; overflow-y: auto; padding: 12px; }
  .upload-area { padding: 12px 16px; border-top: 1px solid #e5e5e7; }
  .upload-btn { width: 100%; padding: 9px; background: #1d1d1f; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .upload-btn:hover { opacity: 0.8; }
  .doc-item { padding: 10px 12px; background: #f5f5f7; border-radius: 6px; margin-bottom: 6px; border: 1px solid #e5e5e7; }
  .doc-name { color: #1d1d1f; font-size: 13px; font-weight: 500; }
  .doc-meta { color: #86868b; font-size: 11px; margin-top: 3px; }
  .doc-del { color: #ff453a; font-size: 11px; cursor: pointer; float: right; }
  .img-strip { display: flex; gap: 3px; overflow-x: auto; padding: 2px 0; max-height: 52px; }
  .img-strip::-webkit-scrollbar { height: 3px; }
  .img-strip::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 2px; }
  .img-thumb { height: 44px; width: auto; border-radius: 3px; cursor: pointer; border: 1px solid #e5e5e7; flex-shrink: 0; }
  .img-thumb:hover { border-color: #1d1d1f; }
  .empty-docs { color: #86868b; font-size: 12px; text-align: center; padding: 30px 0; }
  .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #ffffff; }
  .header { padding: 16px 24px; color: #1d1d1f; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e5e5e7; background: #fafafa; }
  .header-title { margin-right: auto; }
  .header-lang { display: flex; align-items: center; gap: 4px; }
  .lang-btn { background: transparent; border: 1px solid #d2d2d7; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #86868b; transition: all 0.15s; }
  .lang-btn.active { background: #1d1d1f; color: white; border-color: #1d1d1f; }
  .lang-btn:hover:not(.active) { border-color: #1d1d1f; color: #1d1d1f; }
  .header-tools { background: #e5e5e7; font-size: 11px; padding: 2px 10px; border-radius: 12px; color: #1d1d1f; font-weight: 400; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .user { background: #1d1d1f; color: white; align-self: flex-end; }
  .assistant { background: #f5f5f7; color: #1d1d1f; align-self: flex-start; }
  .tool-call { color: #86868b; font-size: 12px; align-self: flex-start; padding: 6px 14px; font-family: SF Mono, Cascadia Code, monospace; background: #f5f5f7; border-radius: 6px; }
  .tool-result { color: #30b94c; font-size: 12px; align-self: flex-start; padding: 6px 14px; font-family: SF Mono, Cascadia Code, monospace; background: #f5f5f7; border-radius: 6px; }
  .streaming { color: #1d1d1f; align-self: flex-start; padding: 10px 16px; font-size: 14px; line-height: 1.6; border-right: 2px solid #1d1d1f; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { border-right-color: transparent; } }
  .input-bar { display: flex; padding: 14px 20px; border-top: 1px solid #e5e5e7; gap: 8px; background: #fafafa; }
  .input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #1d1d1f; }
  .input-bar button { padding: 10px 20px; background: #1d1d1f; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .input-bar button:hover { opacity: 0.8; }
  .input-bar button:disabled { background: #d2d2d7; color: #86868b; cursor: not-allowed; }
  .error { color: #ff453a; background: #fff2f0; align-self: flex-start; }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 3px; }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 2px; }

  .settings-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .settings-overlay.show { display: flex; }
  .settings-modal { background: white; border-radius: 12px; padding: 28px; width: 380px; max-width: 90vw; box-shadow: 0 8px 40px rgba(0,0,0,0.15); }
  .settings-modal h3 { margin: 0 0 16px; font-size: 16px; color: #1d1d1f; }
  .settings-modal label { display: block; font-size: 12px; color: #86868b; margin-bottom: 4px; margin-top: 12px; }
  .settings-modal select, .settings-modal input { width: 100%%; padding: 8px 12px; border: 1px solid #d2d2d7; border-radius: 6px; font-size: 13px; outline: none; box-sizing: border-box; }
  .settings-modal select:focus, .settings-modal input:focus { border-color: #1d1d1f; }
  .settings-modal .btn-row { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
  .settings-modal .btn-primary { padding: 8px 20px; background: #1d1d1f; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .settings-modal .btn-primary:hover { opacity: 0.8; }
  .settings-modal .btn-secondary { padding: 8px 20px; background: #f5f5f7; color: #1d1d1f; border: 1px solid #d2d2d7; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%%; display: inline-block; margin-right: 4px; }
  .status-dot.on { background: #30b94c; }
  .status-dot.off { background: #ff453a; }
</style>
</head>
<body>
<div class="sidebar">
  <div id="newChatBtn" onclick="nc()" style="padding:10px 16px;margin:12px 12px 4px;background:#1d1d1f;color:white;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;text-align:center">+ 新对话</div>

  <div class="sidebar-header" id="oldChatHeader" style="border-top:1px solid #e5e5e7;padding-top:12px;">旧对话</div>
  <div class="sidebar-content" id="oldChats" style="max-height:200px;overflow-y:auto;">
    <div class="empty-docs" id="emptyOldChats">暂无旧对话</div>
  </div>

  <div class="sidebar-header" style="border-top:1px solid #e5e5e7;margin-top:8px;padding-top:12px;" id="docHeader">Bumping <span id="clearBtn" onclick="clr()" style="font-size:11px;color:#86868b;cursor:pointer;float:right;font-weight:400">清空</span></div>
  <div class="sidebar-content" id="docList">
    <div class="empty-docs" id="emptyDocs">还没有文档<br>上传文件即可搜索</div>
  </div>
  <div id="imageList" style="max-height:44px;overflow:hidden;padding:0 16px 4px;">
    <div class="empty-docs" style="font-size:10px;padding:4px 0;color:#86868b;">暂无图片</div>
  </div>
<div class="upload-area">
    <input type="file" id="fileInput" accept=".txt,.md,.pdf,.jpg,.jpeg,.png,.gif" style="display:none" onchange="uploadFile()">
    <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">+ 上传文件</button>
  </div>
</div>
<div class="chat-container">
  <div class="header">
    <span class="header-title" id="headerTitle">助手</span>
    <span class="header-tools" id="headerTools">9 个工具</span>
    <button id="settingsBtn" onclick="showKeySetup()" style="background:transparent;border:none;cursor:pointer;font-size:16px;color:#86868b;padding:2px 4px;" title="API Key">⚙</button>
    <div class="header-lang">
      <button class="lang-btn" id="langZh" onclick="switchLang('zh')">中文</button>
      <button class="lang-btn" id="langEn" onclick="switchLang('en')">EN</button>
    </div>
  </div>
  <div class="messages" id="messages">
    <div class="msg assistant" id="welcomeMsg">你好！我是 Bumping！<br><br>📫 左侧可以上传文档和 PDF<br>🖼️ 上传图片后我可以分析内容<br>🔍 也可以查天气、定位、计算、股票<br><br>试试：上传一篇笔记，然后问\"笔记里提到了什么？\"</div>
  </div>
  <div class="input-bar">
    <input type="text" id="input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') send()">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>
<script>
// ====== 多语言翻译 ======
const LANG = {
  zh: {
    title: "Bumping Agent",
    newChat: "+ 新对话",
    docs: "文档",
    clear: "清空",
    emptyDocs: "还没有文档<br>上传文件即可搜索",
    oldChats: "旧对话",
    emptyOldChats: "暂无旧对话",
    uploadBtn: "+ 上传文件",
    headerTitle: "Bumping Agent",
    tools: "9 个工具",
    welcome: "你好！我是 Bumping！\n\n📫 左侧可以上传文档（.txt / .md），之后问我文档里的内容\n🔍 也可以查天气、定位、计算、时间\n\n试试：上传一篇笔记，然后问\"笔记里提到了什么？\"",
    inputPlaceholder: "输入你的问题...",
    sendBtn: "发送",
    delete: "删除",
    error: "错误",
    networkError: "网络错误",
    toolCall: "调用",
    confirmClear: "确认清空对话？",
    newChatWelcome: "你好！我是 Bumping，我可以查天气、搜股票、定位、计算、检索文档、搜索网页。",
    emptyImages: "暂无图片",
  },
  en: {
    title: "Bumping Agent",
    newChat: "+ New Chat",
    docs: "Documents",
    clear: "Clear",
    emptyDocs: "No documents yet<br>Upload a file to search",
    oldChats: "History",
    emptyOldChats: "No history",
    uploadBtn: "+ Upload File",
    headerTitle: "Bumping Agent",
    tools: "9 tools",
    welcome: "Hello!\n\n📫 Upload documents (.txt / .md) on the left, then ask me about them\n🔍 I can also check weather, location, calculations, time\n\nTry: upload a note and ask \"What does the note say?\"",
    inputPlaceholder: "Type your question...",
    sendBtn: "Send",
    delete: "Delete",
    error: "Error",
    networkError: "Network error",
    toolCall: "Call",
    confirmClear: "Clear all messages?",
    newChatWelcome: "Hello! I'm Bumping. I can check weather, stocks, location, calculations, search documents and the web.",
    emptyImages: "No images",
  }
};

let currentLang = 'zh';
function t(key) {
  return (LANG[currentLang] && LANG[currentLang][key]) || (LANG.zh[key]) || key;
}

function applyLang() {
  function E(x) { return document.getElementById(x); }
  function S(x, v) { var el = E(x); if (el) el.textContent = v; }
  function H(x, v) { var el = E(x); if (el) el.innerHTML = v; }

  S("pageTitle", t("title"));
  S("newChatBtn", t("newChat"));
  H("docHeader", t("docs") + ' <span id="clearBtn" onclick="clr()" style="font-size:11px;color:#86868b;cursor:pointer;float:right;font-weight:400">' + t("clear") + "</span>");
  H("emptyDocs", t("emptyDocs"));
  S("oldChatHeader", t("oldChats"));
  H("emptyOldChats", t("emptyOldChats"));
  S("uploadBtn", t("uploadBtn"));
  S("headerTitle", t("headerTitle"));
  S("headerTools", t("tools"));
  var inp = E("input"); if (inp) inp.placeholder = t("inputPlaceholder");
  S("sendBtn", t("sendBtn"));

  // Image list
  var imgList = E("imageList");
  if (imgList && (!imgList.children.length || (imgList.children.length === 1 && imgList.children[0].className === "empty-docs"))) {
    H("imageList", '<div class="empty-docs" style="font-size:11px;padding:8px 0;">' + t("emptyImages") + "</div>");
  }

  // Welcome message
  var msgs = E("messages");
  if (msgs && msgs.children.length === 1 && msgs.children[0].id === "welcomeMsg") {
    S("welcomeMsg", t("welcome"));
  }

  // Lang buttons
  var zh = E("langZh"); if (zh) zh.className = "lang-btn" + (currentLang === "zh" ? " active" : "");
  var en = E("langEn"); if (en) en.className = "lang-btn" + (currentLang === "en" ? " active" : "");
  document.documentElement.lang = currentLang;
}function switchLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  try { localStorage.setItem('chat_lang', lang); } catch(e) {}
  applyLang();
  refreshOldChats();
}

// Load saved language
try {
  var savedLang = localStorage.getItem('chat_lang');
  if (savedLang === 'en' || savedLang === 'zh') { currentLang = savedLang; }
} catch(e) {}

let allMessages = [];
let streamingDiv = null;

function sv() { try { localStorage.setItem("chat", JSON.stringify(allMessages)); } catch(e) {} }
function ld() {
  try {
    var s = localStorage.getItem("chat");
    if (s) {
      try { allMessages = JSON.parse(s); } catch(e) { allMessages = []; localStorage.removeItem("chat"); }
      var msgs = document.getElementById("messages");
      msgs.innerHTML = "";
      allMessages.forEach(function(m) {
        if (m.role === "user") {
          var d = document.createElement("div");
          d.className = "msg user";
          d.textContent = m.content;
          msgs.appendChild(d);
        } else {
          showMessage(m);
        }
      });
    }
    refreshOldChats();
  } catch(e) {}
}

// ====== 图片列表 ======
async function loadImages() {
  const resp = await fetch("/uploads/images");
  const imgs = await resp.json();
  const el = document.getElementById("imageList");
  if (imgs.length === 0) {
    el.innerHTML = "<div class='empty-docs' style='font-size:11px;padding:8px 0;'>暂无图片</div>";
    return;
  }
  el.innerHTML = "<div class='img-strip'>" + imgs.map(function(f) {
    return "<img class='img-thumb' src='/uploads/images/" + f.name + "?t=" + Date.now() + "' title='" + f.name + "' onclick='addMessage(\"分析这张图片: " + f.name + "\", \"user\"); sendImage(\"" + f.name + "\")'>";
  }).join("") + "</div>";
}

function sendImage(filename) {
  var input = document.getElementById("input");
  input.value = "分析这张图片: " + filename;
  send();
}

// ====== 文档列表 ======
async function loadDocs() {
  const resp = await fetch('/documents' + '?lang=' + currentLang);
  const docs = await resp.json();
  const el = document.getElementById('docList');
  if (docs.length === 0) {
    el.innerHTML = '<div class="empty-docs" id="emptyDocs">' + t('emptyDocs') + '</div>';
    return;
  }
  el.innerHTML = docs.map(function(d) {
    return '<div class="doc-item">' +
      '<span class="doc-name">' + d.name + '</span>' +
      '<span class="doc-del" onclick="deleteDoc(\'' + d.name + '\')">' + t('delete') + '</span>' +
      '<div class="doc-meta">' + (d.size/1024).toFixed(1) + ' KB · ' + d.updated + '</div>' +
      '</div>';
  }).join('');
}
loadDocs();

async function uploadFile() {
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  form.append('lang', currentLang);
  const resp = await fetch('/upload', { method: 'POST', body: form });
  const data = await resp.json();
  loadDocs();
  if (file.type && file.type.startsWith('image/')) { loadImages(); }
  addMessage(data.message || data.error, data.error ? 'error' : 'tool-result');
  input.value = '';
}

async function deleteDoc(name) {
  await fetch('/documents/' + encodeURIComponent(name) + '?lang=' + currentLang, { method: 'DELETE' });
  loadDocs();
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  addMessage(text, 'user');
  allMessages.push({ role: 'user', content: text });
  sv();

  // show streaming placeholder
  var msgs = document.getElementById('messages');
  streamingDiv = document.createElement('div');
  streamingDiv.className = 'streaming';
  streamingDiv.textContent = '';
  msgs.appendChild(streamingDiv);

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: allMessages, lang: currentLang })
    });
    const data = await resp.json();

    if (streamingDiv) { streamingDiv.remove(); streamingDiv = null; }

    if (data.error) {
      addMessage(t('error') + ': ' + data.error, 'error');
    } else {
      for (var si = 0; si < data.messages.length; si++) {
        var m = data.messages[si];
        if (si >= allMessages.length) {
          showMessage(m);
        }
      }
      allMessages = data.messages; sv();
      // Auto-save to old chats (reuse same key per conversation)
      try {
        if (allMessages.length > 0) {
          if (!currentChatId) {
            currentChatId = "chat_" + Date.now();
          }
          localStorage.setItem(currentChatId, JSON.stringify(allMessages));
          refreshOldChats();
        }
      } catch(e) {
        console.log("Auto-save error:", e);
      }
    }
  } catch (e) {
    if (streamingDiv) { streamingDiv.remove(); streamingDiv = null; }
    addMessage(t('networkError') + ': ' + e.message, 'error');
  }

  document.getElementById('sendBtn').disabled = false;
}
function showMessage(m) {
  if (m.role === 'user') return;
  var msgs = document.getElementById('messages');
  if (m.role === 'assistant' && m.tool_calls) {
    for (var i = 0; i < m.tool_calls.length; i++) {
      var tc = m.tool_calls[i];
      var d = document.createElement('div');
      d.className = 'tool-call';
      d.textContent = '🛠 ' + t('toolCall') + ': ' + tc.function.name + '(' + tc.function.arguments + ')';
      msgs.appendChild(d);
      d.scrollIntoView({ behavior: 'smooth' });
    }
  }
  if (m.role === 'tool') {
    var d = document.createElement('div');
    d.className = 'tool-result';
    d.textContent = '📳 ' + m.content.slice(0, 200);
    msgs.appendChild(d);
    d.scrollIntoView({ behavior: 'smooth' });
  }
  if (m.role === 'assistant' && m.content) {
    var d = document.createElement('div');
    d.className = 'msg assistant';
    d.textContent = m.content;
    msgs.appendChild(d);
    d.scrollIntoView({ behavior: 'smooth' });
  }
}

function nc() {
  if (allMessages.length > 0) {
    currentChatId = "chat_" + Date.now();
    localStorage.setItem(currentChatId, JSON.stringify(allMessages));
  }
  currentChatId = null;
  allMessages = [];
  localStorage.removeItem("chat");
  document.getElementById("messages").innerHTML = '<div class="msg assistant" id="welcomeMsg">' + t('newChatWelcome') + '</div>';
  refreshOldChats();
}

function restoreChat(key) {
  // Save current chat before switching
  if (allMessages.length > 0) {
    if (!currentChatId) {
      currentChatId = "chat_" + Date.now();
    }
    localStorage.setItem(currentChatId, JSON.stringify(allMessages));
  }
  currentChatId = key;
  var data = JSON.parse(localStorage.getItem(key));
  if (data) {
    allMessages = data;
    sv();
    var msgs = document.getElementById("messages");
    msgs.innerHTML = "";
    allMessages.forEach(function(m) {
      if (m.role === "user") {
        var d = document.createElement("div");
        d.className = "msg user";
        d.textContent = m.content;
        msgs.appendChild(d);
      } else {
        showMessage(m);
      }
    });
  }
}

function refreshOldChats() {
  var el = document.getElementById("oldChats");
  if (!el) return;
  var keys = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k.startsWith("chat_")) keys.push(k);
  }
  console.log("refreshOldChats found", keys.length, "keys:", keys);
  if (keys.length === 0) {
    el.innerHTML = "<div class='empty-docs' id='emptyOldChats'>" + t('emptyOldChats') + "</div>";
    return;
  }
  keys.sort().reverse();  // Newest first
  var html = keys.slice(0, 20).map(function(key) {
    try {
      var ts = new Date(parseInt(key.split("_")[1]));
      var timeStr = ts.toLocaleString(currentLang === 'zh' ? "zh-CN" : "en-US");
      var data = JSON.parse(localStorage.getItem(key));
      var preview = (data && data.length > 0 ? data[0].content : "...");
      return "<div class='doc-item' onclick='restoreChat(\"" + key + "\")' style='cursor:pointer'>" +
        "<div class='doc-name'>" + (preview.length > 15 ? preview.slice(0, 15) : preview) + "</div>" +
        "<div class='doc-meta'>" + timeStr + "</div></div>";
    } catch(e) {
      console.log("Skipping invalid key:", key, e);
      localStorage.removeItem(key);
      return "";
    }
  }).filter(function(x) { return x !== ""; }).join("");
  el.innerHTML = html;
}

function clr() {
  if (!confirm(t('confirmClear'))) return;
  allMessages = [];
  sv();
  localStorage.removeItem("chat");
  document.getElementById("messages").innerHTML = '<div class="msg assistant" id="welcomeMsg">' + t('newChatWelcome') + '</div>';
}

function addMessage(text, role) {
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}

// Save on page unload
window.addEventListener('beforeunload', function() { try { sv(); } catch(e) {} });

// Initialize language and load saved chats
applyLang();
ld();
setTimeout(function() { try { refreshOldChats(); } catch(e) {} }, 500);

function showKeySetup() { document.getElementById("settingsOverlay").classList.add("show"); }
function hideKeySetup() { document.getElementById("settingsOverlay").classList.remove("show"); }
function saveApiKey() {
  var provider = document.getElementById("apiProvider").value;
  var key = document.getElementById("apiKeyInput").value.trim();
  if (!key) { alert("Please enter your API key"); return; }
  var btn = document.getElementById("settingsSaveBtn");
  btn.textContent = "Saving...";
  btn.disabled = true;
  fetch("/api/key", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({provider: provider, key: key})
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.ok) {
      try { localStorage.setItem("api_provider", provider); localStorage.setItem("api_key", key); } catch(e) {}
      hideKeySetup();
      updateApiStatus();
    } else {
      alert("Error: " + (data.error || data.message));
    }
  }).catch(function(e) { alert("Network error: " + e.message); })
  .finally(function() { btn.textContent = "Save"; btn.disabled = false; });
}
function updateApiStatus() {
  fetch("/api/key/status").then(function(r) { return r.json(); }).then(function(data) {
    var el = document.getElementById("settingsBtn");
    if (data.configured) {
      el.innerHTML = '<span class="status-dot on"></span>';
      el.title = "API: " + data.provider;
    } else {
      el.innerHTML = '<span class="status-dot off"></span>';
      el.title = "Click to set API Key";
    }
  }).catch(function() {});
}
function checkSavedKey() {
  try {
    var key = localStorage.getItem("api_key");
    var provider = localStorage.getItem("api_provider");
    if (key && provider) {
      fetch("/api/key", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({provider: provider, key: key})
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.ok) { updateApiStatus(); }
        else { showKeySetup(); }
      }).catch(function() {});
    } else { setTimeout(showKeySetup, 500); }
  } catch(e) {}
  updateApiStatus();
}
if (document.readyState === "complete") { checkSavedKey(); }
else { window.addEventListener("load", checkSavedKey); }
</script>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-modal">
    <h3 id="settingsTitle">API Key</h3>
    <label id="settingsProviderLabel">Provider</label>
    <select id="apiProvider">
      <option value="deepseek">DeepSeek (cheaper, recommended)</option>
      <option value="openai">OpenAI (supports image analysis)</option>
    </select>
    <label id="settingsKeyLabel">API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-..." />
    <div class="btn-row">
      <button class="btn-secondary" id="settingsCancelBtn" onclick="hideKeySetup()">Cancel</button>
      <button class="btn-primary" onclick="saveApiKey()" id="settingsSaveBtn">Save</button>
    </div>
  </div>
</div>

</body>
</html>
